# =============================================================================
#  Inception - MANDATORY stack
# -----------------------------------------------------------------------------
#  Exactly the three services the subject asks for: nginx, wordpress, mariadb.
#  Bonus services live in docker-compose.bonus.yml and are never loaded here.
#
#      make          -> this file only
#      make bonus    -> this file + docker-compose.bonus.yml
# =============================================================================
name: inception

services:

  # ---------------------------------------------------------------------------
  #  NGINX - the only door into the infrastructure, TLS 1.2/1.3, port 443 only.
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:inception          # image name == service name, no `latest` tag
    container_name: nginx
    build:
      context: ./requirements/nginx
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    ports:
      - "443:443"
    volumes:
      # nginx serves the static assets of the site straight from the shared
      # WordPress volume, and forwards only .php to php-fpm.
      - wordpress_files:/var/www/html
    depends_on:
      - wordpress
    networks:
      - inception
    restart: always

  # ---------------------------------------------------------------------------
  #  WordPress + php-fpm - no web server inside, listens on 9000 for nginx.
  # ---------------------------------------------------------------------------
  wordpress:
    image: wordpress:inception
    container_name: wordpress
    build:
      context: ./requirements/wordpress
    environment:
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - WP_URL=${WP_URL}
      - WP_TITLE=${WP_TITLE}
      - WP_ADMIN_USER=${WP_ADMIN_USER}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL}
      - WP_USER=${WP_USER}
      - WP_USER_EMAIL=${WP_USER_EMAIL}
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    volumes:
      - wordpress_files:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - inception
    restart: always

  # ---------------------------------------------------------------------------
  #  MariaDB - never published to the host, reachable only over the network.
  # ---------------------------------------------------------------------------
  mariadb:
    image: mariadb:inception
    container_name: mariadb
    build:
      context: ./requirements/mariadb
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
    secrets:
      - db_root_password
      - db_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    healthcheck:
      # Over the unix socket: the root account is deliberately not reachable
      # over TCP, so a TCP ping would (correctly) be refused.
      test: ["CMD-SHELL", "mariadb-admin ping --silent --socket=/run/mysqld/mysqld.sock --user=root --password=\"$$(cat /run/secrets/db_root_password)\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: always

# =============================================================================
#  Secrets - passwords are files mounted at /run/secrets/<name>, never env vars
#  and never baked into an image layer.
# =============================================================================
secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt

# =============================================================================
#  Named volumes - required by the subject, and bound to /home/<login>/data
#  through the local driver (this is still a *named* volume, not a bind mount
#  declared on the service).
# =============================================================================
volumes:
  wordpress_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/wordpress
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/mariadb

# =============================================================================
#  Network - a user-defined bridge. No `network: host`, no `links:`.
# =============================================================================
networks:
  inception:
    name: inception
    driver: bridge
