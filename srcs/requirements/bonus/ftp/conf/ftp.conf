# vsftpd - single local user, chrooted to the WordPress document root.
listen=YES
listen_ipv6=NO

anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022

# Keep the user inside /var/www/html and nowhere else.
chroot_local_user=YES
allow_writeable_chroot=YES

# Only the accounts listed in /etc/vsftpd.userlist may log in.
userlist_enable=YES
userlist_file=/etc/vsftpd.userlist
userlist_deny=NO

# Passive mode: the client opens the data connection, which is what works
# through Docker's port publishing. The range matches the published ports.
pasv_enable=YES
pasv_min_port=21000
pasv_max_port=21010

secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd
seccomp_sandbox=NO

# Session logging. vsftpd opens its log file with O_APPEND|O_CREAT, which
# fails on /dev/stdout, so it writes to a real file instead:
#     docker exec ftp cat /var/log/vsftpd.log
xferlog_enable=YES
xferlog_std_format=NO
log_ftp_protocol=YES
vsftpd_log_file=/var/log/vsftpd.log

# Foreground: vsftpd itself is PID 1, no forking into the background.
background=NO
