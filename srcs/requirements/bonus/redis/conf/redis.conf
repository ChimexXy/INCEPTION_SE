# Redis as a pure WordPress object cache.
daemonize no
port 6379

# Reachable only from the `inception` docker network - the port is never
# published to the host, which is why no password is required here.
bind 0.0.0.0
protected-mode no

# A cache must never grow without bound: 256 MB, then evict the least recently
# used keys. This is what "properly manage the cache" means in the subject.
maxmemory 256mb
maxmemory-policy allkeys-lru

# A cache is disposable by definition: persistence is disabled so redis never
# writes RDB/AOF files and never needs a volume of its own.
save ""
appendonly no

loglevel notice
logfile ""
