; php-fpm pool for WordPress.
; Replaces Debian's default pool, which listens on a unix socket that nginx
; (in another container) could never reach.
[www]
user  = www-data
group = www-data

; TCP socket reachable from the nginx container over the `inception` network.
listen = 0.0.0.0:9000

pm                   = dynamic
pm.max_children      = 10
pm.start_servers     = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests      = 500

; Send worker output to the container log instead of a file nobody reads.
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
